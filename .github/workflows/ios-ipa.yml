name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ios-ipa.yml
      - tools/cloud-ipa.py
      - make-ios.sh
      - crates/**
      - ios/**

permissions:
  contents: read

concurrency:
  group: mush8-ios-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check private build inputs
        id: inputs
        env:
          MUSH8_INPUTS_URL: ${{ secrets.MUSH8_INPUTS_URL }}
        run: |
          if [[ -n "$MUSH8_INPUTS_URL" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## IPA is waiting for your files
          No input URL is configured, so this run will check the host tools only. No IPA will be created.

          Add this repository Actions secret:
          - `MUSH8_INPUTS_URL`: a Google Drive file-sharing link (Anyone with the link, Viewer) or direct HTTPS download URL for a ZIP with `prod.keys`, `base.nsp`, and `upd4-0-1.nsp` at its root.

          Then select **Build iOS IPA → Run workflow**. See `docs/ipa-cloud-build.md`.
          EOF
          fi

      - name: Download your game dumps privately
        if: steps.inputs.outputs.ready == 'true'
        env:
          MUSH8_INPUTS_URL: ${{ secrets.MUSH8_INPUTS_URL }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mush8-download-env"
          "$RUNNER_TEMP/mush8-download-env/bin/python" -m pip install --disable-pip-version-check 'gdown==6.1.0'
          "$RUNNER_TEMP/mush8-download-env/bin/python" tools/cloud-ipa.py download

      - name: Prepare Apple and Rust tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if ! xcrun --sdk iphoneos metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk iphoneos metal --version
          command -v xcodegen >/dev/null || brew install xcodegen
          TOOLCHAIN=$(sed -n 's/^TOOLCHAIN=//p' make-ios.sh)
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup override set "$TOOLCHAIN"
          rustup target add aarch64-apple-ios --toolchain "$TOOLCHAIN"

      - name: Compile host tools
        run: cargo build --release --locked

      - name: Test GPU heap boundaries
        run: cargo test --release --locked -p nxhost heap_tests -- --nocapture

      - name: Build IPA
        if: steps.inputs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          bash make-ios.sh --ipa
          python3 tools/cloud-ipa.py verify

      - name: Protect IPA for automatic delivery
        if: steps.inputs.outputs.ready == 'true'
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes-256-gcm \
            -in build/Mush8.ipa -out build/Mush8.ipa.cms -outform DER \
            -recip tools/ipa-delivery-cert.pem \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256

      - name: Upload protected IPA transfer
        if: steps.inputs.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mush8-IPA-transfer
          path: build/Mush8.ipa.cms
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Report IPA result
        if: success() && steps.inputs.outputs.ready == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## IPA built
          The **Mush8-IPA-transfer** artifact below is automatically protected for delivery. Tell the build assistant this run is complete so it can retrieve and decrypt the artifact, then provide the normal `Mush8.ipa` privately. You do not need to create or enter a password.

          Install the resulting IPA with AltStore or SideStore. This build has not been tested on a physical iPhone.
          EOF

      - name: Remove private build files
        if: always()
        run: |
          rm -f prod.keys base.nsp upd4-0-1.nsp build/Mush8.ipa build/Mush8.ipa.cms
          rm -rf work target/ios target/ios-res target/ios-xcode
